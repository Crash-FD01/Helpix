<html><head><meta charset="utf-8"><title>Chat finta</title>
<style>body{font-family:sans-serif;background:#fff} #prompt-textarea{border:1px solid #999;min-height:60px;padding:8px;white-space:pre-wrap}</style>
</head><body>
<main id="thread">
  <p>Prova questo comando:</p>
  <pre><code class="language-bash">echo hello-helpix</code></pre>
  <p>Codice Python (niente pulsante):</p>
  <pre><code class="language-python">print("ciao")</code></pre>
  <p>Comando rischioso:</p>
  <pre><code class="language-bash">rm -rf /tmp/helpix-e2e-dir &amp;&amp; echo removed</code></pre>
  <p>Riepilogo:</p>
  <pre><code>HELPIX-TASK
Problema: il wifi non va</code></pre>
  <pre><code class="language-bash">open-package</code></pre>
</main>
<div id="attachments"></div>
<div id="prompt-textarea" class="ProseMirror" contenteditable="true"></div>
<button data-testid="send-button" id="send">Invia</button>
<script>
  // come ProseMirror: gestisce l'incolla e chiama preventDefault
  const box = document.getElementById('prompt-textarea');
  window.pastedFiles = [];
  box.addEventListener('paste', (e) => {
    const files = [...e.clipboardData.files];
    if (files.length) {
      e.preventDefault();
      for (const f of files) {
        window.pastedFiles.push({name: f.name, type: f.type, size: f.size});
        const d = document.createElement('div'); d.className = 'att'; d.textContent = f.name;
        document.getElementById('attachments').appendChild(d);
      }
      return;
    }
    const text = e.clipboardData.getData('text/plain');
    if (text) { e.preventDefault(); box.append(document.createTextNode(text)); }
  });
  // invio finto: mostra il messaggio e, se è la richiesta di riepilogo, «scrive» la risposta a pezzi
  window.sent = [];
  // come ChatGPT senza account: i turni in un contenitore «prose», un avviso fisso sotto la conversazione e, dopo
  // un cambio di pagina, un vecchio <main> nascosto prima di quello vero
  window.ensurePlainWrap = () => {
    const thread = document.getElementById('thread');
    let wrap = document.getElementById('plainwrap');
    if (!wrap) {
      wrap = document.createElement('div'); wrap.id = 'plainwrap'; wrap.className = 'prose turns';
      thread.appendChild(wrap);
      const note = document.createElement('div'); note.className = 'disclaimer';
      note.textContent = 'ChatGPT is AI and can make mistakes.'; thread.appendChild(note);
      const old = document.createElement('main'); old.style.display = 'none';
      old.innerHTML = '<p>pagina precedente</p>'; document.body.insertBefore(old, document.body.firstChild);
    }
    return wrap;
  };
  document.getElementById('send').addEventListener('click', () => {
    // come le chat vere appena caricate: i primi clic possono andare persi, o l'invio può essere bloccato
    if (window.blockSend) return;
    if (window.dropClicks > 0) { window.dropClicks--; return; }
    const text = box.textContent;
    window.sent.push(text);
    // come ChatGPT quando ridisegna la conversazione: i messaggi di prima spariscono e la risposta compare subito
    if (window.remount) document.querySelectorAll('[data-message-author-role="assistant"]').forEach(e => e.remove());
    box.textContent = '';
    const thread = document.getElementById('thread');
    const fence = text.indexOf('```');
    if (fence >= 0) {  // il modello vuoto della richiesta, mostrato come blocco di codice
      const pre = document.createElement('pre'); const code = document.createElement('code');
      code.textContent = text.slice(fence + 3).split('```')[0].trim();
      pre.appendChild(code); thread.appendChild(pre);
    }
    if (window.shellMarkup && !text.includes('HELPIX-TASK')) {
      // come ChatGPT con account (interfaccia nuova, pagina-chat.txt dal PC di prova con Linux Mint, 2026-11-10):
      // nessun contrassegno sui turni; turno = div con h4.sr-only «You said:» / «ChatGPT said:»; la bolla
      // dell'utente è molto annidata e accanto ha una riga di azioni nuova e senza testo; la risposta è in
      // div.MarkdownRoot-<hash>. Fuori da <main>, la chat «flottante» ridotta con una vecchia risposta nascosta.
      if (!document.getElementById('floating')) {
        const fl = document.createElement('section'); fl.id = 'floating'; fl.setAttribute('role', 'dialog');
        fl.innerHTML = '<div class="hidden" style="display:none"><div class="MarkdownRoot-rZKhxa">' +
                       '<p>vecchia risposta della chat flottante</p></div></div>';
        document.body.appendChild(fl);
      }
      const sr = label => '<h4 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;' +
                          'clip:rect(0,0,0,0)"><span>' + label + '</span></h4>';
      let bubble = '<div class="whitespace-pre-wrap"></div>';
      for (let i = 0; i < 8; i++) bubble = '<div class="b' + i + '">' + bubble + '</div>';
      const user = document.createElement('div'); user.className = 'flex flex-col';
      user.innerHTML = '<div class="block-BQZwFn">' + sr('You said:') + '<div class="group/user-message"><div class="w-full">' +
                       '<div class="group/user-message flex"><div class="bg-user-message">' + bubble + '</div>' +
                       '<div class="flex flex-row-reverse"><button aria-label="Copy"></button>' +
                       '<button aria-label="Edit message"></button></div></div></div></div></div>';
      user.querySelector('.whitespace-pre-wrap').textContent = text;
      thread.appendChild(user);
      const stop = document.createElement('button'); stop.setAttribute('data-testid', 'stop-button');
      stop.textContent = 'Stop'; document.body.appendChild(stop);
      const turn = document.createElement('div'); turn.className = 'flex flex-col';
      turn.innerHTML = '<div class="block-BQZwFn"><span></span><div>' + sr('ChatGPT said:') +
                       '<div><div class="group flex"><div class="' +
                       (window.shellNoMarker ? 'Answer-x1' : 'MarkdownRoot-rZKhxa') + '"><p></p></div></div></div>' +
                       '</div></div>';
      const p = turn.querySelector('p');
      setTimeout(() => thread.appendChild(turn), 500);
      const words = ('Risposta finta: controlla il driver del wifi con nmcli device status e riavvia ' +
                     'NetworkManager.').split(' ');
      let w = -6;
      const t4 = setInterval(() => {
        const n = ++w;
        if (n <= 0) return;
        requestAnimationFrame(() => {
          p.textContent = words.slice(0, n).join(' ');
          if (n >= words.length && window.quoteQuestion) {  // la risposta cita la domanda in un elenco
            const ol2 = document.createElement('ol'); const li = document.createElement('li');
            li.textContent = text; ol2.appendChild(li); p.parentElement.appendChild(ol2);
          }
          if (n >= words.length) {  // a risposta finita compare la riga di azioni del turno
            const row = document.createElement('div'); row.className = 'actionRow-nqqZbm';
            row.innerHTML = '<button aria-label="Copy"></button><button aria-label="Read aloud"></button>';
            thread.appendChild(row);
            setTimeout(() => stop.remove(), 400);
          }
        });
        if (n >= words.length) clearInterval(t4);
      }, 120);
      return;
    }
    if (window.ucMarkup && !text.includes('HELPIX-TASK')) {
      // come ChatGPT senza account (chatgpt.com/uc/…, struttura vista sul PC di prova): la conversazione è un
      // ol[aria-label=Conversation] di <li>, intestazione nascosta per turno, risposta in section «DIL content»
      // fatta di <span> per parola; sotto la conversazione l'avviso fisso
      let ol = document.querySelector('ol[aria-label="Conversation"]');
      if (!ol) {
        ol = document.createElement('ol'); ol.setAttribute('aria-label', 'Conversation'); thread.appendChild(ol);
        const note = document.createElement('div'); note.innerHTML = '<p><span>ChatGPT is AI and can make mistakes.</span></p>';
        thread.appendChild(note);
      }
      const sr = label => { const h = document.createElement('h4'); h.setAttribute('aria-label', label);
        h.style.cssText = 'position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)';
        h.textContent = label; return h; };
      const user = document.createElement('li');
      user.innerHTML = '<div><div><div><p></p></div></div></div><div><div role="group"><button aria-label="Copy"></button>' +
                       '<span role="status"></span></div></div>';
      user.querySelector('p').textContent = text;
      user.prepend(sr('You said:')); ol.appendChild(user);
      const stop = document.createElement('button'); stop.setAttribute('data-testid', 'stop-button');
      stop.textContent = 'Stop'; document.body.appendChild(stop);
      const turn = document.createElement('li');
      turn.innerHTML = '<div><span></span><div><div><div><section></section><div role="status"></div></div></div></div></div>' +
                       '<div role="group" aria-label="Response actions"><button aria-label="Copy response"></button></div>';
      turn.prepend(sr('ChatGPT said:'));
      const section = turn.querySelector('section');
      if (!window.ucNoLabel) section.setAttribute('aria-label', 'DIL content');
      const p = document.createElement('p'); section.appendChild(p);
      setTimeout(() => ol.appendChild(turn), 600);  // il turno dell'IA compare dopo un attimo
      const words = ('Risposta finta: controlla il driver del wifi con nmcli device status e riavvia ' +
                     'NetworkManager.').split(' ');
      let w = -8;
      const t3 = setInterval(() => {
        const n = ++w;
        if (n <= 0) return;
        requestAnimationFrame(() => {
          if (n > 1) p.appendChild(document.createTextNode(' '));
          const span = document.createElement('span'); span.textContent = words[n - 1]; p.appendChild(span);
          if (n >= words.length && window.quoteQuestion) {  // la risposta cita la domanda in un elenco
            const ol2 = document.createElement('ol'); const li = document.createElement('li');
            li.textContent = text; ol2.appendChild(li); section.appendChild(ol2);
          }
          if (n >= words.length) setTimeout(() => stop.remove(), 400);
        });
        if (n >= words.length) clearInterval(t3);
      }, 120);
      return;
    }
    if (!text.includes('HELPIX-TASK')) {  // risposta normale, scritta a pezzi come fanno le chat
      const stop = document.createElement('button'); stop.setAttribute('data-testid', 'stop-button');
      stop.textContent = 'Stop'; document.body.appendChild(stop);
      let msg = document.createElement('div');
      if (window.plainMarkup) {
        // come ChatGPT senza account: nessun contrassegno sui messaggi, i turni in un contenitore con classe «prose»,
        // sotto un avviso fisso; la risposta resta vuota per un attimo prima di comparire
        const wrap = window.ensurePlainWrap();
        const user = document.createElement('div'); user.className = 'turn';
        const said = document.createElement('h5'); said.className = 'sr-only'; said.textContent = 'You said:';
        const bubble = document.createElement('div'); bubble.className = 'bubble'; bubble.textContent = text;
        const copy = document.createElement('button'); copy.textContent = 'Copia';
        user.append(said, bubble, copy); wrap.appendChild(user);
        const turn = document.createElement('div'); turn.className = 'turn';
        msg.className = 'markdown'; turn.appendChild(msg);
        const tools = document.createElement('button'); tools.textContent = 'Copia'; turn.appendChild(tools);
        msg.addTurn = () => { if (!turn.isConnected) wrap.appendChild(turn); };  // compare con le prime parole
      } else {
        msg.setAttribute('data-message-author-role', 'assistant');
        thread.appendChild(msg);
      }
      const words = ('Risposta finta: controlla il driver del wifi con nmcli device status e riavvia ' +
                     'NetworkManager.').split(' ');
      let w = window.plainMarkup ? -12 : 0;  // senza contrassegni: la risposta compare dopo circa 1,5 s
      // l'IA «ragiona»: il posto della risposta c'è subito ma resta vuoto per circa 8 s, senza pulsante Stop
      if (window.thinkFirst && !window.plainMarkup) { w = -70; stop.remove(); }
      // come le chat vere (React): il testo si aggiorna al prossimo fotogramma, che con la pagina nascosta non arriva
      const t2 = setInterval(() => {
        const n = ++w;
        if (n <= 0) return;
        if (n >= words.length) clearInterval(t2);
        requestAnimationFrame(() => {
          if (msg.addTurn) msg.addTurn();
          if (window.thinkFirst && !stop.isConnected && n < words.length) document.body.appendChild(stop);
          msg.textContent = words.slice(0, n).join(' ');
          if (window.quoteQuestion && n >= words.length) {  // la risposta cita la domanda in un elenco
            const ol = document.createElement('ol'); const li = document.createElement('li');
            li.textContent = text; ol.appendChild(li); msg.appendChild(ol);
          }
          if (n >= words.length) setTimeout(() => stop.remove(), 400);
        });
      }, 120);
      return;
    }
    const stop = document.createElement('button'); stop.setAttribute('data-testid', 'stop-button');
    stop.textContent = 'Stop'; document.body.appendChild(stop);
    const answer = ['HELPIX-TASK', 'Obiettivo:', 'la stampante non stampa', '', 'Contesto:', 'Fedora 44 KDE', '',
                    'Cosa è stato fatto (comandi, risultati, decisioni):', 'lpstat -p, journalctl -u cups', '', 'Stato attuale:',
                    'driver sbagliato'];
    const pre = document.createElement('pre'); const code = document.createElement('code');
    pre.appendChild(code); thread.appendChild(pre);
    let i = 0;
    const tick = setInterval(() => {
      code.textContent = answer.slice(0, ++i).join('\n');
      if (i === answer.length) { clearInterval(tick); setTimeout(() => stop.remove(), 600); }
    }, 700);
  });
</script>
</body></html>
