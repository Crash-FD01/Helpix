#
# Controlli a ogni push e pull request: stile del codice, licenze (REUSE), sintassi degli script, test.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Controlli (ruff, REUSE, script)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff reuse shellcheck-py
      - run: ruff check .
      - name: Licenze di ogni file (REUSE)
        run: reuse lint
      - name: Sintassi degli script
        run: |
          shellcheck -S warning install.sh uninstall.sh packaging/*.sh tests/run_all.sh site/setup.sh .github/scripts/*.sh

  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.10: la più vecchia supportata da Qt 6.12 (Ubuntu 22.04, Debian 12 hanno 3.10/3.11)
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Helpix e dipendenze Python
        run: pip install .
      - name: Librerie di sistema per Qt (le installa Helpix stesso, come sul PC degli utenti)
        run: |
          sudo apt-get update -q
          .github/scripts/annotate.sh "Dipendenze di sistema" python -m helpix.sysdeps install --yes
      - name: Schemi dei desktop per i test delle scorciatoie
        run: >
          sudo apt-get install -y -q dbus gnome-settings-daemon-common gnome-shell-common
          cinnamon-desktop-data mate-control-center-common xfconf
      - name: Test
        run: .github/scripts/annotate.sh "Test" tests/run_all.sh python

  windows:
    name: Windows (Python 3.13)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Helpix e dipendenze Python
        run: pip install .
      - name: Avvio della finestra principale
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: >
          .github/scripts/annotate.sh "Avvio su Windows" python -c "import sys;
          from PySide6.QtWidgets import QApplication; import PySide6.QtWebEngineWidgets;
          app = QApplication([]); from helpix.config import Settings, SecretStore, ensure_dirs; ensure_dirs();
          from helpix.ui.main_window import MainWindow; s = Settings();
          s.data.update(engine='web', skip_setup=True, quick_shortcut=False, show_tips=False);
          w = MainWindow(s, SecretStore()); w.show(); from PySide6.QtCore import QTimer;
          QTimer.singleShot(3000, app.quit); app.exec(); print('finestra principale ok')"
      - name: Test
        shell: bash
        env:
          TEST_TIMEOUT: "90"
        run: .github/scripts/annotate.sh "Test su Windows" tests/run_all.sh python
