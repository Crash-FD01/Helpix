#
# Rilascio: parte quando pubblichi un tag «vX.Y.Z» (uguale alla versione di pyproject.toml).
#   1. costruisce i pacchetti .deb e .rpm per x86_64 e aarch64 e l'installer di Windows, e li prova;
#   2. li firma con la chiave del secret HELPIX_GPG_PRIVATE_KEY;
#   3. crea la release della versione con i pacchetti e SHA256SUMS firmato;
#   4. aggiorna il repository APT (release «repo») e quello RPM + il sito (GitHub Pages).
# Da lì «apt upgrade», «dnf upgrade» e «zypper update» trovano la nuova versione.
# Per ripubblicare una versione (es. dopo aver cambiato il sito): Actions → Rilascio → Run workflow → tag.
# Quando cambiano i file dei pacchetti su main fa solo la prova: costruisce e installa, senza pubblicare nulla.
name: Rilascio

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "packaging/**"
      - "pyproject.toml"
      - "helpix/sysdeps.py"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag già esistente da (ri)pubblicare, es. v0.15.0"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Pacchetti ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Il tag corrisponde alla versione
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Il tag $TAG non corrisponde alla versione $version di pyproject.toml"; exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Strumenti e librerie di sistema (servono a calcolare le dipendenze del .deb)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q rpm
          python -m venv /tmp/probe
          /tmp/probe/bin/pip install -q .
          .github/scripts/annotate.sh "Dipendenze di sistema (${{ matrix.arch }})" \
            /tmp/probe/bin/python -m helpix.sysdeps install --yes
      - name: Costruisci
        run: .github/scripts/annotate.sh "Build (${{ matrix.arch }})" packaging/build-packages.sh ${{ matrix.arch }}
      - name: Prova il pacchetto installato
        run: |
          sudo apt-get install -y -q ./dist/packages/helpix_*.deb
          cd /tmp
          QT_QPA_PLATFORM=offscreen /opt/helpix/venv/bin/python3 -P -c \
            "import helpix, requests, PySide6.QtWebEngineWidgets; print('Helpix', helpix.__version__)"
          helpix --help > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: |
            dist/packages/*.deb
            dist/packages/*.rpm
            dist/packages/glibc-*.txt
          compression-level: 0
          retention-days: 7

  windows:
    name: Installer Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Costruisci Helpix.exe e il programma di installazione
        shell: pwsh
        run: packaging\windows\build.ps1
      - name: Prova il programma installato
        shell: pwsh
        run: |
          $setup = Get-Item dist\packages\Helpix-*-Setup.exe
          $p = Start-Process $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER' -Wait -PassThru
          if ($p.ExitCode) { throw "installazione non riuscita ($($p.ExitCode))" }
          $exe = "$env:LOCALAPPDATA\Programs\Helpix\Helpix.exe"
          if (-not (Test-Path $exe)) { throw "Helpix.exe non installato in $exe" }
          $env:QT_QPA_PLATFORM = 'offscreen'
          $t = Start-Process $exe -ArgumentList '--self-test' -Wait -PassThru
          if ($t.ExitCode) { throw "prova del programma installato non riuscita ($($t.ExitCode))" }
          Write-Host "Helpix installato e funzionante: $exe"
          $u = Start-Process "$env:LOCALAPPDATA\Programs\Helpix\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES' -Wait -PassThru
          if ($u.ExitCode) { throw "disinstallazione non riuscita ($($u.ExitCode))" }
      - uses: actions/upload-artifact@v4
        with:
          name: packages-windows
          path: dist/packages/*.exe
          compression-level: 0
          retention-days: 7

  publish:
    name: Pubblica release e repository
    needs: [build, windows]
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: pkgs
          merge-multiple: true
      - name: Strumenti
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q rpm createrepo-c apt-utils
      - name: Chiave di firma
        env:
          GPG_PRIVATE_KEY: ${{ secrets.HELPIX_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error::Manca il secret HELPIX_GPG_PRIVATE_KEY: crealo con packaging/github-setup.sh"; exit 1
          fi
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')" >> "$GITHUB_ENV"
      - name: Indirizzi
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          if [ "${repo,,}" = "$owner.github.io" ]; then site="https://$owner.github.io"; else site="https://$owner.github.io/$repo"; fi
          {
            echo "SITE_URL=$site"
            echo "APT_URL=https://github.com/$GITHUB_REPOSITORY/releases/download/repo"
            echo "RPM_URL=https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
            echo "REPO_URL=https://github.com/$GITHUB_REPOSITORY"
          } >> "$GITHUB_ENV"
      - name: Firma i pacchetti e prepara i repository
        run: packaging/update-repos.sh pkgs out "$RPM_URL" "$SITE_URL"
      - name: Prepara il sito
        run: packaging/render-site.sh out/site "$SITE_URL" "$APT_URL" "$REPO_URL" "${TAG#v}" pkgs

      - name: Release della versione
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd pkgs
          sha256sum -- *.deb *.rpm *.exe > SHA256SUMS
          gpg --batch --yes --local-user "$GPG_KEY_ID" --armor --detach-sign SHA256SUMS
          notes="Installa o aggiorna: $SITE_URL — una volta aggiunto il repository, gli aggiornamenti arrivano con apt, dnf o zypper."
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" -- *.deb *.rpm *.exe SHA256SUMS SHA256SUMS.asc --clobber
          else
            gh release create "$TAG" --verify-tag --latest --title "Helpix ${TAG#v}" --notes "$notes" --generate-notes \
              -- *.deb *.rpm *.exe SHA256SUMS SHA256SUMS.asc
          fi

      - name: Repository APT (release «repo»)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view repo > /dev/null 2>&1; then
            gh release create repo --target "$GITHUB_SHA" --prerelease --latest=false --title "Repository APT" \
              --notes "File del repository APT di Helpix, usati da apt: non servono a mano. Installazione: $SITE_URL"
          fi
          old="$(gh release view repo --json assets --jq '.assets[].name')"
          # prima i pacchetti, poi gli indici che li elencano: apt non trova mai un indice senza il suo pacchetto
          gh release upload repo out/apt/*.deb --clobber
          gh release upload repo out/apt/Packages out/apt/Packages.gz out/apt/Release out/apt/Release.gpg \
            out/apt/InRelease --clobber
          keep="$(cd out/apt && ls)"
          for name in $old; do
            grep -qxF "$name" <<< "$keep" || gh release delete-asset repo "$name" --yes
          done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/site
      - id: deploy
        uses: actions/deploy-pages@v4
